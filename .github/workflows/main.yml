name: "ExtNoBrasil PC Virtual - Windows App + Tailscale"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    name: "Iniciar PC Virtual"
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: "Configurar Área de Trabalho Remota"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Ativar RDP mantendo a autenticação NLA.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          # Permitir RDP somente a partir da faixa IPv4 do Tailscale.
          Get-NetFirewallRule -DisplayName 'ExtNoBrasil-RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'ExtNoBrasil-RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Profile Any

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          Write-Host "Configuração RDP concluída."

      - name: "Criar usuário Skyro"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Gerar uma senha aleatória forte.
          $bytes = New-Object byte[] 32
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $rng.GetBytes($bytes)
          $rng.Dispose()

          $password = [Convert]::ToBase64String($bytes).
            Replace('+','X').Replace('/','Y').TrimEnd('=')

          $securePassword = ConvertTo-SecureString `
            $password -AsPlainText -Force

          if (Get-LocalUser -Name 'Skyro' -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name 'Skyro'
          }

          New-LocalUser `
            -Name 'Skyro' `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description 'ExtNoBrasil PC Virtual'

          Add-LocalGroupMember -Group 'Administrators' -Member 'Skyro'
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'Skyro'

          # Disponibilizar a senha no ambiente da etapa de conexão.
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "Usuário Skyro criado."

      - name: "Instalar Tailscale"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale-setup.msi"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer
          $process = Start-Process msiexec.exe `
            -ArgumentList @('/i', "`"$installer`"", '/quiet', '/norestart') `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Instalação do Tailscale falhou: código $($process.ExitCode)"
          }

      - name: "Conectar ao Tailscale"
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Configure o secret TAILSCALE_AUTH_KEY nas configurações do repositório."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "O executável do Tailscale não foi encontrado."
          }

          & $ts up `
            "--authkey=$env:TS_AUTHKEY" `
            "--hostname=extnobrasil-$env:GITHUB_RUN_ID" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Não foi possível conectar ao Tailscale."
          }

          $ip = $null
          for ($i = 0; $i -lt 24 -and -not $ip; $i++) {
            Start-Sleep -Seconds 5
            $result = & $ts ip -4
            if ($LASTEXITCODE -eq 0 -and $result) {
              $ip = ($result | Select-Object -First 1).Trim()
            }
          }

          if (-not $ip) {
            throw "O Tailscale não atribuiu um endereço IPv4."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Tailscale conectado: $ip"

      - name: "Verificar serviço RDP"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ready = $false
          for ($i = 0; $i -lt 24; $i++) {
            $service = Get-Service -Name TermService
            $test = Test-NetConnection `
              -ComputerName '127.0.0.1' `
              -Port 3389 `
              -WarningAction SilentlyContinue

            if ($service.Status -eq 'Running' -and $test.TcpTestSucceeded) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            throw "O serviço RDP não abriu a porta 3389."
          }

          Write-Host "Serviço RDP ativo."

      - name: "Exibir dados de conexão e manter sessão"
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " EXT NOBRASIL PC VIRTUAL [BETA]"
          Write-Host " Criador: ExtNoBrasil (ExT)"
          Write-Host " Discord: Brasil_kill0"
          Write-Host " Sistema: Windows do runner GitHub"
          Write-Host " Acesso: Windows App + Tailscale"
          Write-Host "----------------------------------------------"
          Write-Host " Endereço: $env:TAILSCALE_IP"
          Write-Host " Porta: 3389"
          Write-Host " Usuário: Skyro"
          Write-Host " Senha: $env:RDP_PASSWORD"
          Write-Host "----------------------------------------------"
          Write-Host " GPU dedicada: não garantida"
          Write-Host " Aceleração 3D: não garantida"
          Write-Host " FPS: não garantidos"
          Write-Host "=============================================="
          Write-Host ""

          # Manter o job ativo até o limite configurado.
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] PC Virtual ativo."
            Start-Sleep -Seconds 60
          }

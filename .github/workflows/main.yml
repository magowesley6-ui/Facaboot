
name: ExtNoBrasil PC - Windows App RDP

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: "Senha forte para o acesso remoto"
        required: true
        type: string

permissions:
  contents: read

jobs:
  remote-pc:
    name: Iniciar PC remoto
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configurar acesso remoto
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ inputs.rdp_password }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:RDP_PASSWORD.Length -lt 16) {
            throw "Use uma senha com pelo menos 16 caracteres."
          }

          Write-Host "=== EXT NOBRASIL PC [BETA] ==="
          Write-Host "Configurando serviço RDP..."

          $secure = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name "Skyro" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "Skyro" -Password $secure `
              -AccountNeverExpires
          } else {
            Set-LocalUser -Name "Skyro" -Password $secure
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member "Skyro" -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member "Skyro" -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name UserAuthentication -Value 1

          New-NetFirewallRule `
            -DisplayName "ExtNoBrasil-RDP" `
            -Direction Inbound -Action Allow `
            -Protocol TCP -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          Start-Service TermService
          Start-Sleep -Seconds 3

          if (-not (Get-NetTCPConnection -LocalPort 3389 `
              -State Listen -ErrorAction SilentlyContinue)) {
            throw "RDP não está escutando na porta 3389."
          }

          Write-Host "RDP local iniciado."
          Write-Host "Usuário: Skyro"

      - name: Criar endereço remoto temporário
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ssh = Get-Command ssh.exe -ErrorAction SilentlyContinue
          if (-not $ssh) {
            throw "Cliente SSH não encontrado."
          }

          $stdout = "$env:RUNNER_TEMP\pinggy-out.txt"
          $stderr = "$env:RUNNER_TEMP\pinggy-err.txt"

          $args = @(
            "-T",
            "-o", "StrictHostKeyChecking=no",
            "-o", "ServerAliveInterval=30",
            "-o", "ExitOnForwardFailure=yes",
            "-p", "443",
            "-R", "0:127.0.0.1:3389",
            "tcp@free.pinggy.io"
          )

          $proc = Start-Process -FilePath $ssh.Source `
            -ArgumentList $args `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          $address = $null

          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2

            $log = ""
            foreach ($file in @($stdout, $stderr)) {
              if (Test-Path $file) {
                $log += Get-Content $file -Raw `
                  -ErrorAction SilentlyContinue
              }
            }

            $m = [regex]::Match(
              $log,
              'tcp://([A-Za-z0-9.-]+):([0-9]{2,5})'
            )

            if ($m.Success) {
              $address = "$($m.Groups[1].Value):$($m.Groups[2].Value)"
              break
            }

            if ($proc.HasExited) { break }
          }

          if (-not $address) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "O túnel não forneceu um endereço."
          }

          "PINGGY_PID=$($proc.Id)" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=== DADOS PARA WINDOWS APP ==="
          Write-Host "Endereço: $address"
          Write-Host "Usuário: Skyro"
          Write-Host "Senha: a que você digitou ao iniciar o workflow"
          Write-Host "================================"

      - name: Manter sessão ativa
        shell: pwsh
        run: |
          Write-Host "Sessão temporária iniciada."
          Write-Host "O endereço do túnel pode expirar."

          while ($true) {
            $p = Get-Process -Id $env:PINGGY_PID `
              -ErrorAction SilentlyContinue

            if (-not $p) {
              throw "O túnel foi encerrado."
            }

            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Verificando sessão..."
            Start-Sleep -Seconds 30
          }
          
